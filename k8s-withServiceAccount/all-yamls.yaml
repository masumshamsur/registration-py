# ----------- ServiceAccount for Backend -----------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: registration-py-postgres
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-role
  namespace: registration-py-postgres
rules:
  - apiGroups: [""]
    resources: ["pods", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-rolebinding
  namespace: registration-py-postgres
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: registration-py-postgres
roleRef:
  kind: Role
  name: backend-role
  apiGroup: rbac.authorization.k8s.io
---
# ----------- Backend Deployment & Service -----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: registration-py-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa  # <- Service account assigned
      containers:
        - name: backend
          image: masum012924/registration-backend:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: POSTGRES_HOST
              value: postgres-service
            - name: POSTGRES_DATABASE
              value: mydatabase
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1    
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: registration-py-postgres
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
# ----------- Frontend Deployment & Service -----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: registration-py-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: masum012924/registration-frontend:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: registration-py-postgres
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30050
  type: NodePort
---
# ----------- PostgreSQL Secret -----------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: registration-py-postgres
type: Opaque
data:
  username: bXlVc2Vy  # base64 for 'myUser'
  password: bXlQYXNz  # base64 for 'myPass'
---
# ----------- PostgreSQL StatefulSet -----------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: registration-py-postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15.0
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: POSTGRES_DB
              value: "mydatabase"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data  # PostgreSQL data directory
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc  # This must match the PVC metadata.name
---
# ----------- PostgreSQL Headless Service -----------
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: registration-py-postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
# ----------- PostgreSQL PV and PVC -----------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  namespace: registration-py-postgres
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data/postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: registration-py-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
